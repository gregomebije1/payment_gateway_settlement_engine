# 1. Structural strategy for your integration test tables
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 2. Prevent Redis connection timeouts from hanging your test suite run
spring.data.redis.connect-timeout=2s

# 3. Log levels for easy debugging during a Maven build failure
logging.level.org.testcontainers=INFO
://level.com.gregomebije.gateway=DEBUG
