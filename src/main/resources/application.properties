spring.application.name=gateway
server.port=8082

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.file.name=app.log

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_gateway
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Flyway
spring.flyway.enabled=true
# If you are running against a database that already has tables, set this to true
spring.flyway.baseline-on-migrate=true 
spring.flyway.locations=classpath:db/migration
# 1. Instruct Flyway to allow destructive cleaning on this run
spring.flyway.clean-disabled=false

# 2. Tell Flyway to drop the tracking tables if validation mismatches
spring.flyway.clean-on-validation-error=true
# Force Hibernate to wait for Flyway to complete migrations
spring.jpa.properties.hibernate.validator.apply_to_ddl=false


# For WebClient
spring.webflux.client.max-in-memory-size=1MB

# integrations
#-----------------
ledger.service.url=http://localhost:8081
wallet.service.url=http://localhost:8080

services.wallet.base-url=http://localhost:8080
services.ledger.base-url=http://localhost:8081
services.ledger.token=${LEDGER_API_TOKEN:your-token-here}
services.ledger.email=${LEDGER_SERVICE_EMAIL:gateway-worker@example.com}
services.ledger.password=${LEDGER_SERVICE_PASSWORD:change-me}
services.ledger.token-ttl-minutes=50

outbox.poll-interval-ms=500

#-------------------------

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Kafka Connection
spring.kafka.bootstrap-servers=localhost:9092