spring.application.name=gateway
server.port=8082

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.file.name=app.log

logging.level.com.gregomebije=DEBUG

# Disable in production
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_gateway
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# For WebClient
spring.webflux.client.max-in-memory-size=1MB

# integrations
services.wallet.base-url=http://localhost:8080
services.ledger.base-url=http://localhost:8081
services.ledger.token=adfafewa24efwd
services.ledger.email=payment_gateway_tenant@mangital.com
services.ledger.password=password
services.ledger.tenant-id=payment_gateway_tenant
services.ledger.token-ttl-minutes=50

outbox.poll-interval-ms=300000

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Kafka Connection
spring.kafka.bootstrap-servers=localhost:9092